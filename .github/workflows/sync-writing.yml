name: Sync writing

# Pulls new and edited Substack posts into src/content/writing/ and pushes them
# to main. The push triggers the Vercel production deploy (Git integration).
# A run that finds nothing new makes no commit, so it costs no Vercel build.
#
# Never prunes: if Substack hiccups, posts are not deleted from the site.
# Use `corepack pnpm sync:writing -- --prune` by hand for that.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the hour to dodge the queue
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-writing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # package.json has no engines field and the repo has no .nvmrc; 22 is
      # what the site is built and tested with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      # Exits non-zero on any Substack error, and when Substack returns zero
      # posts. That fails the run before anything is committed.
      - name: Sync posts from Substack
        run: corepack pnpm sync:writing

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain -- src/content/writing)" ]; then
            echo "No new or updated posts; nothing to commit."
            exit 0
          fi

          # Post titles, from each changed file's frontmatter (JSON-encoded).
          title() {
            node -p 'JSON.parse(process.argv[1])' \
              "$(sed -n 's/^title: //p' "$1" | head -n 1)"
          }
          added=""
          updated=""
          n_added=0
          n_updated=0
          while IFS= read -r line; do
            file="${line:3}"
            case "$file" in
              src/content/writing/*.md) ;;
              *) continue ;;
            esac
            if [ "${line:0:2}" = "??" ]; then
              added="${added}- $(title "$file")"$'\n'
              n_added=$((n_added + 1))
            else
              updated="${updated}- $(title "$file")"$'\n'
              n_updated=$((n_updated + 1))
            fi
          done < <(git status --porcelain --untracked-files=all -- src/content/writing)

          if [ "$n_added" -eq 1 ] && [ "$n_updated" -eq 0 ]; then
            subject="Add post from Substack: ${added#- }"
            subject="${subject%$'\n'}"
          elif [ "$n_added" -eq 0 ] && [ "$n_updated" -eq 1 ]; then
            subject="Update post from Substack: ${updated#- }"
            subject="${subject%$'\n'}"
          else
            subject="Sync writing from Substack ($n_added new, $n_updated updated)"
          fi

          {
            echo "$subject"
            echo
            if [ -n "$added" ]; then
              echo "New:"
              printf '%s' "$added"
              echo
            fi
            if [ -n "$updated" ]; then
              echo "Updated:"
              printf '%s' "$updated"
              echo
            fi
            echo "Automated by .github/workflows/sync-writing.yml"
          } > "$RUNNER_TEMP/commit-message.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/writing
          git commit -F "$RUNNER_TEMP/commit-message.txt"

          # main may have moved while this ran; the posts live in their own
          # directory, so a rebase is safe. One retry, then fail loudly.
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
