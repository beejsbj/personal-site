# CI: lint, type check, and build plus the full node:test suite on every PR and every push to main.
# Three separate jobs so each reports (and can be required) on its own. No path filters: a
# required check that skips never reports.
#
# `pnpm test:prism` (the Chromium browser suites) is NOT run here: it takes 6 to 8 minutes
# even on a 64-core box and needs a Chromium install. Run it on bjslab through
# `cockpit resources run` (see docs/checks.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # pnpm@10.6.5 is pinned in package.json (packageManager); corepack reads it.
  CI: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The suite reads the built output (dist/), so it builds first; a build failure fails this job.
      - run: pnpm build
      - run: pnpm test
